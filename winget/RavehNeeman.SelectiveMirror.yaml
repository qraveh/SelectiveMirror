# winget manifest TEMPLATE for SelectiveMirror.
#
# This file in the repository is a TEMPLATE — the values below are
# kept loosely in sync with the latest release for documentation
# purposes, but the manifest actually submitted to
# https://github.com/microsoft/winget-pkgs is regenerated by
# `.github/workflows/release.yml` after each MSI build (PR-W1, panel
# review pre-release 2026-04-28). The CI step:
#   1. Reads the published MSI's SHA-256 (PR-Q5 verifies the hash
#      matches between local and downloaded copies).
#   2. Substitutes PackageVersion / InstallerUrl / InstallerSha256.
#   3. Uploads the result as workflow artifact `winget-manifest-<ver>`.
#   4. If repo variable WINGET_SUBMIT_ENABLED=1 and secret
#      WINGET_SUBMIT_PAT is present, runs `wingetcreate update --submit`
#      to PR microsoft/winget-pkgs.
#
# To do a manual submission, download the workflow-artifact manifest
# and either: (a) `wingetcreate submit <file>` from a machine with the
# PAT, or (b) fork microsoft/winget-pkgs by hand and PR the manifest
# at manifests/r/RavehNeeman/SelectiveMirror/<version>/.

PackageIdentifier: RavehNeeman.SelectiveMirror
PackageVersion: 1.0.0
PackageName: SelectiveMirror
Publisher: RavehNeeman
