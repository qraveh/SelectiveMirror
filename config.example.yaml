# SelectiveMirror configuration
# Copy to ~/.selectivemirror/config.yaml and customize.

# Default rclone remote for new mirrors added via `smirror addmirror`.
# Set with: smirror remote gdrive:smirror
# default_remote: ""

mirrors:
  - name: MyProject
    local_path: C:\Projects\MyProject    # Local directory to watch
    remote: "gdrive:backup/MyProject"    # rclone remote (any of 70+ backends)
    debounce_sec: 5                       # 0 (default) = immediate sync with FairQueue fairness; >0 = quiet-window for Office-style saves
    max_file_size_mb: 100                 # Skip files larger than this

  # Add more mirrors:
  # - name: AnotherFolder
  #   local_path: C:\Projects\Another
  #   remote: "s3:my-bucket/another"
  #   syncignore_path: ""           # Override .syncignore location (default: <local_path>/.syncignore)
  #   delete_policy: ""             # Per-mirror override: ignore, delete, or quarantine (empty = use global)
  #   quarantine_days: 0            # Per-mirror quarantine retention (0 = use global)
  #   rclone_extra_flags: []        # Per-mirror rclone flags, appended after global (e.g. ["--drive-chunk-size", "64M"])
  #   pre_sync_hook: ""             # Per-mirror pre-sync shell command (overrides global; see SECURITY.md for hook rules)
  #   post_sync_hook: ""            # Per-mirror post-sync shell command (overrides global)

# Patterns applied to ALL mirrors (in addition to per-mirror .syncignore)
# Uses .gitignore syntax
global_excludes:
  - .git/
  - __pycache__/
  - "*.pyc"
  - node_modules/
  - venv/
  - .venv/
  - "*.log"
  - "*.tar"
  - "*.tar.gz"
  - "*.zip"
  - "*.sqlite"
  - .env
  - "~$*"          # Office temp files
  - "*.tmp"
  - ".~lock.*"     # LibreOffice lock files
  - "*~"           # Backup files (editors, OS file replacement)

# State and log locations (default: ~/.selectivemirror/)
# state_db: ~/.selectivemirror/state.db
# log_file: ~/.selectivemirror/selectivemirror.log
# log_level: info    # debug, info, warn, error

# rclone settings
# rclone_path: rclone           # Path to rclone binary (auto-resolved on service install)
# rclone_config: ""             # Path to rclone.conf (auto-resolved on service install)
# rclone_extra_flags: []        # Extra flags for every rclone call
# bandwidth_limit: ""           # e.g. "10M" to cap at 10 MB/s

# Performance tuning
# sync_workers: 4              # Concurrent sync workers (1-16, default 4)
# reconcile_interval_sec: 300  # Periodic full sync interval in seconds (default 300 = 5 min)
                               # Catches changes invisible to fsnotify (WSL, network drives, external tools)

# Delete policy: what happens when a local file is deleted
# delete_policy: delete         # ignore, delete (default), or quarantine
# quarantine_days: 30           # Days to keep quarantined files (only for quarantine mode)

# Service settings
# heartbeat_interval_sec: 300   # Write heartbeat every N seconds
# verify_interval_sec: 21600    # Auto-verify every 6h (0 = default 6h, -1 = disabled)
# notify_enabled: true          # Windows toast notifications on drift/failure

# Alerting: incident-based webhook notifications for anomalies
# alert_webhook_url: ""         # HTTPS endpoint for JSON alerts (https-only; Slack, Discord, PagerDuty, etc.)
# alert_min_severity: error     # Minimum severity to alert: info, warning, error, critical

# Anomaly detection (ghost leaks, circuit breaker trips, panics, stale reconciliation, etc.)
# anomaly_detection_enabled: true   # Record anomalies to ~/.selectivemirror/anomalies/ (default: true)

# Pre/post-sync hooks — shell commands run before/after each file sync (see SECURITY.md).
# When any hook is configured AND smirror runs as a Windows Service, the config file
# must be owned by Administrators or LocalSystem (SEC-C5). Shell metacharacters in
# SMIRROR_* environment values are rejected before hook execution.
# pre_sync_hook: ""             # Global default pre-sync hook (cmd.exe /C on Windows, sh -c on Unix)
# post_sync_hook: ""            # Global default post-sync hook
