# SelectiveMirror telemetry edge proxy — Cloudflare Worker config
#
# Live endpoint (telemetry v2):
#   POST https://smirror-telemetry.selectivemirror.workers.dev/v1/contribute
#
# Retired paths (return HTTP 410 Gone since the v1→v2 schema collapse):
#   /v1/bug-reports           — pre-v2 schema; replaced by /v1/contribute
#   /v1/installations/report  — pre-v2 schema; replaced by /v1/contribute
#   /v1/forget                — v2 stores no rows tied to install_id
#                               server-side, so there's nothing to forget
#
# Deploy (maintainer-only):
#   cd worker
#   npm install                  # one-time, installs wrangler
#   npx wrangler deploy
#
# Setup before first deploy:
#   npx wrangler secret put SUPABASE_ANON_KEY
#     (paste the anon public key when prompted)
#   npx wrangler kv namespace create RATE_LIMIT_KV
#     (copy the returned id into the [[kv_namespaces]] block below)
#
# Note: deleting and redeploying the Worker (e.g., `wrangler delete`) wipes
# its secrets. Re-set SUPABASE_ANON_KEY after any redeploy that lost state.
#
# Public-config note: this file is committed to a public repository on
# purpose. It contains the production Supabase project ref and KV
# namespace ID below — defensible because Supabase anon keys are
# designed to be public + protected by Row-Level Security policies, and
# the KV namespace ID is not a credential. Rotation of either requires
# provisioning a fresh Supabase project / KV namespace and updating
# this file in a coordinated commit.

name = "smirror-telemetry"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Workers subdomain (account-level) is "selectivemirror". This was set
# via the Cloudflare API after an initial misconfiguration; the dashboard
# pencil-icon edit is gated to "DELETE then PUT" via the Workers Scripts
# API endpoint. See worker/README.md for the recovery procedure.
workers_dev = true

# Non-secret config exposed to Worker
[vars]
SUPABASE_PROJECT_REF = "qkspigvkniiiwxggdvbr"

# KV namespace for per-IP rate limiting. Created via:
#   wrangler kv namespace create RATE_LIMIT_KV
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "65753913e2f1490b8be92f6ad66627f9"

# Cron triggers (none yet — a future addition for cleanup or batch tasks)
# [triggers]
# crons = []

# Routes (custom domain — only with paid Cloudflare DNS)
# routes = [{ pattern = "telemetry.example.dev/*", zone_name = "example.dev" }]
