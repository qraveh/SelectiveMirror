version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  # Windows-only release. The mattn/go-sqlite3 driver requires CGo; cross-
  # compiling CGo from a single runner to Linux/Darwin needs Zig or separate
  # runners, which we do not set up. Project is positioned Windows-first
  # (CLAUDE.md) — no Linux/Darwin integration or users exist. MSI (installer/
  # build-msi.ps1) is the primary distribution channel; this ZIP is secondary.
  #
  # ldflags include the per-version telemetry HMAC derived key, computed
  # by the release workflow before GoReleaser runs. The master key never
  # touches a binary; CI computes HMAC-SHA256(master, version) and exports
  # the hex result as SMIRROR_TELEMETRY_DERIVED_KEY for embedding here.
  # Empty default means -dev / local builds get no production key and
  # cannot submit to the production endpoint.
  - main: ./cmd/smirror/
    binary: smirror
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/qraveh/SelectiveMirror/internal/telemetry.buildKey={{.Env.SMIRROR_TELEMETRY_DERIVED_KEY}}
    env:
      - CGO_ENABLED=1
      - SMIRROR_TELEMETRY_DERIVED_KEY={{ if index .Env "SMIRROR_TELEMETRY_DERIVED_KEY" }}{{ .Env.SMIRROR_TELEMETRY_DERIVED_KEY }}{{ end }}
    goos:
      - windows
    goarch:
      - amd64

archives:
  - formats: ['zip']
    # Stable filename — drop the version from the archive name so
    # `https://github.com/<owner>/<repo>/releases/latest/download/
    # SelectiveMirror_windows_amd64.zip` works as a permanent URL
    # across releases. The version is still in `smirror version` and
    # in the GitHub Release page metadata; embedding it in the
    # filename forces every doc / link to be edited per release.
    # Matches the MSI which has always been version-free
    # (`SelectiveMirror.msi`).
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - LICENSE
      - CREDITS.md
      - THIRD-PARTY-LICENSES.txt
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: qraveh
    name: SelectiveMirror
  draft: true
  prerelease: auto
