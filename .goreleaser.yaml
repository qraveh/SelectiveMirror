version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  # Windows-only release. The mattn/go-sqlite3 driver requires CGo; cross-
  # compiling CGo from a single runner to Linux/Darwin needs Zig or separate
  # runners, which we do not set up. Project is positioned Windows-first
  # (CLAUDE.md) — no Linux/Darwin integration or users exist. MSI (installer/
  # build-msi.ps1) is the primary distribution channel; this ZIP is secondary.
  - main: ./cmd/smirror/
    binary: smirror
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64

archives:
  - formats: ['zip']
    files:
      - README.md
      - LICENSE
      - CREDITS.md
      - THIRD-PARTY-LICENSES.txt
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: qraveh
    name: SelectiveMirror
  draft: true
  prerelease: auto
