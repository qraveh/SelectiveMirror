name: Bug Report
description: Report a bug in SelectiveMirror
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below.
        If possible, run `smirror report-bug --stdout` and paste the output in the Environment section.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Configure smirror with...
        2. Start smirror
        3. Create/modify/delete a file
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (data loss, crash, hang)
        - Major (feature broken, wrong behavior)
        - Minor (edge case, workaround exists)
        - Cosmetic (typo, formatting)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `smirror report-bug --stdout` here, or describe your setup.
      render: text
      placeholder: |
        smirror version: ...
        platform: windows/amd64
        rclone version: ...

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output. Redact sensitive information.
      render: text
