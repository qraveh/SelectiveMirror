name: SLA smoke

# PR-Q4 (panel review pre-release 2026-04-28). Latency / integrity /
# throughput / memory smoke tests live in test/sla_smoke.ps1. They are
# noisy on shared CI and not safe to gate every release on, but they
# catch real regressions in the metrics smirror commits to in the SRS
# (NFR-TB-01..07, RU-01..05, CA-01..03).
#
# Strategy: run on a nightly schedule + workflow_dispatch. The
# SM-keeper agent (docs/operations/release-runbook.md) checks the
# latest run before approving a tag — pre-tag procedure includes
# "release-dryrun green AND latest sla-smoke green within 48h."
# release.yml itself does NOT depend on this workflow (so a flaky
# nightly doesn't block tagging), but a sustained red here is a
# release-readiness signal.

on:
  schedule:
    # 03:00 UTC nightly. Off-peak for shared GitHub-hosted runners,
    # gives the maintainer fresh data each morning.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / SHA to test (default: master)'
        required: false
        default: 'master'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sla:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Install rclone
        # Direct download from downloads.rclone.org. Matches release.yml /
        # release-dryrun.yml (single source of truth for the pinned
        # version). Replaces a prior winget-based path that reported
        # success but didn't reliably land the binary on PATH or at the
        # documented %LOCALAPPDATA%\Microsoft\WinGet\Packages\... fallback
        # location on windows-2025 runners.
        shell: pwsh
        run: |
          $url = 'https://downloads.rclone.org/v1.73.2/rclone-v1.73.2-windows-amd64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'rclone.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'rclone'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem $dest -Recurse -Filter rclone.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "rclone.exe not found after extract"; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.Directory.FullName
          & $exe.FullName version

      - name: Build smirror.exe
        env:
          CGO_ENABLED: '1'
        run: go build -o bin/smirror.exe ./cmd/smirror/

      - name: SLA smoke (latency / integrity / throughput / memory)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File test/sla_smoke.ps1

      - name: Upload SLA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sla-results-${{ github.run_id }}
          path: |
            test/sla-results-*.txt
            test/sla-results-*.json
          if-no-files-found: warn
          retention-days: 30
