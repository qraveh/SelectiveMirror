name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      # Defense in depth: re-run the unit suite at release time. CI runs on
      # `push: branches: [master]` / `pull_request: branches: [master]`, but
      # release runs on `push: tags: ['v*']` — a separate trigger. GitHub
      # Actions `needs:` does not cross-link between workflows, so without
      # this step a tag pushed onto a commit whose CI failed would still
      # produce a published release. We do NOT skip on CI-already-green
      # status because the cost of re-running the suite is far less than
      # the cost of a broken release.
      - name: Verify C toolchain present (CGo required for SQLite driver)
        shell: pwsh
        run: gcc --version

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./cmd/... -count=1
        env:
          CGO_ENABLED: 1

      # Compute the per-version telemetry HMAC derived key from the master
      # key (stored as a GitHub Actions repository secret). The master key
      # never enters the binary; only the version-derived key does. See
      # docs/telemetry-microserver-architecture.md "HMAC signing scheme".
      - name: Compute version-derived telemetry HMAC key
        id: hmac
        shell: pwsh
        env:
          MASTER_KEY: ${{ secrets.SMIRROR_TELEMETRY_MASTER_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:MASTER_KEY)) {
              Write-Host "SMIRROR_TELEMETRY_MASTER_KEY secret is not set; building with empty derived key (binary will not be able to submit telemetry to the production endpoint)."
              echo "SMIRROR_TELEMETRY_DERIVED_KEY=" >> $env:GITHUB_ENV
              exit 0
          }
          $version = "${{ github.ref_name }}" -replace '^v',''
          $masterBytes = New-Object byte[] ($env:MASTER_KEY.Length / 2)
          for ($i = 0; $i -lt $masterBytes.Length; $i++) {
              $masterBytes[$i] = [Convert]::ToByte($env:MASTER_KEY.Substring($i * 2, 2), 16)
          }
          $hmac = [System.Security.Cryptography.HMACSHA256]::new()
          $hmac.Key = $masterBytes
          $versionBytes = [System.Text.Encoding]::UTF8.GetBytes($version)
          $hash = $hmac.ComputeHash($versionBytes)
          $derived = -join ($hash | ForEach-Object { $_.ToString('x2') })
          # Sanity check on length — derived key must be 64 hex chars.
          if ($derived.Length -ne 64) {
              Write-Error "Derived key has unexpected length: $($derived.Length)"
              exit 1
          }
          # Add to GITHUB_ENV so subsequent steps (including GoReleaser)
          # see it as an environment variable. We do NOT echo the value
          # to logs (it would leak the per-version key).
          echo "SMIRROR_TELEMETRY_DERIVED_KEY=$derived" >> $env:GITHUB_ENV
          Write-Host "Derived key computed for version $version (64 hex chars, value redacted)."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Forward the derived key into GoReleaser so .goreleaser.yaml
          # ldflags can reference {{.Env.SMIRROR_TELEMETRY_DERIVED_KEY}}.
          SMIRROR_TELEMETRY_DERIVED_KEY: ${{ env.SMIRROR_TELEMETRY_DERIVED_KEY }}

  msi:
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # WiX v7 (shipped 2025-09-25) introduced the Open Source Maintenance
      # Fee scheme (error WIX7015 without an OSMF EULA acceptance). Pin to
      # v6 to match the local dev toolchain and avoid the EULA gate.
      - name: Install WiX (v6 — avoid v7 OSMF EULA requirement)
        run: dotnet tool install --global wix --version 6.0.2

      - name: Add WiX UI extension
        run: wix extension add WixToolset.UI.wixext/6.0.2 -g

      - name: Extract version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        run: powershell -ExecutionPolicy Bypass -File installer\build-msi.ps1 -Version ${{ steps.version.outputs.VERSION }}

      # SEC-C2 regression gate: block the release if any MSI invariant fails
      # (service silently registered, wrong install scope, HKCU registry
      # entries, uninstall leftover files, etc.). GitHub Actions
      # windows-latest runners execute as admin, which the script requires.
      - name: MSI smoke test (install / task round-trip / uninstall)
        run: powershell -ExecutionPolicy Bypass -File installer\smoke-test.ps1 -SkipBuild -Version ${{ steps.version.outputs.VERSION }}

      - name: Upload MSI to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} installer\bin\Release\SelectiveMirror.msi --clobber
