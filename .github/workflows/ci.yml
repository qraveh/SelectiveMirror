name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Node.js 20 is deprecated in GitHub Actions effective 2026-06-02; new
# default is Node.js 24. Opt in now to silence the deprecation warning
# and exercise the upcoming default before it lands. Safe — no action
# we use has a Node-24-specific incompatibility, and we can remove this
# env once the default flips.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Verify C toolchain present (CGo required for SQLite driver)
        shell: pwsh
        run: |
          gcc --version
          # GitHub-hosted windows-latest runners ship with mingw-w64 on PATH.
          # If this ever fails, add: choco install mingw -y

      - name: Build
        run: go build -v ./cmd/smirror/

      - name: Verify module bytes match go.sum (SEC-C1 supply-chain guard)
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./internal/... ./cmd/...

      - name: Unit tests with coverage
        shell: pwsh
        run: |
          go test -v ./internal/... -coverprofile="$env:GITHUB_WORKSPACE\coverage.out" -covermode=count
          if (!(Test-Path "$env:GITHUB_WORKSPACE\coverage.out")) {
            Write-Error "coverage.out not created"
            exit 1
          }

      - name: Coverage gate (fail if below 60%)
        # A-29119-12: per-release re-measurement of VV-Plan §5.2.
        # Floor raised from 35% (v0.5.0 baseline) to 60% (v1.0 target).
        # The gate value here MUST stay aligned with the v1.0 target the
        # iso-compliance.md document records — when the doc target moves,
        # this number moves with it.
        shell: pwsh
        run: |
          $output = & go tool cover "-func=$env:GITHUB_WORKSPACE\coverage.out"
          $line = $output | Select-String "total:"
          Write-Host $line
          if ($line -match '(\d+\.\d+)%') {
            $pct = [double]$Matches[1]
            Write-Host "Coverage: ${pct}%"
            if ($pct -lt 60.0) {
              Write-Error "Coverage ${pct}% is below 60% threshold (v1.0 target per iso-compliance.md X-04)"
              exit 1
            }
          } else {
            Write-Error "Could not parse coverage from: $output"
            exit 1
          }

      - name: Per-package coverage report (A-29119-12 evidence)
        # A-29119-12: produce a per-package coverage table on every CI run
        # so it can be compared release-over-release. The artifact is
        # uploaded for the most-recent run; reviewers find drift here
        # rather than re-measuring each time.
        shell: pwsh
        run: |
          $covOut = & go tool cover "-func=$env:GITHUB_WORKSPACE\coverage.out"
          # Group by package, compute per-package average from the
          # function-level lines emitted by `go tool cover -func`.
          $lines = $covOut -split "`n"
          $byPkg = @{}
          foreach ($line in $lines) {
            if ($line -match '^github.com/qraveh/SelectiveMirror/(internal/[^/]+)/[^\s]+\s+([^\s]+)\s+(\d+\.\d+)%') {
              $pkg = $Matches[1]
              $pct = [double]$Matches[3]
              if (-not $byPkg.ContainsKey($pkg)) { $byPkg[$pkg] = @{ sum=0.0; n=0 } }
              $byPkg[$pkg].sum += $pct
              $byPkg[$pkg].n += 1
            }
          }
          Write-Host "=== Per-package coverage (A-29119-12) ==="
          foreach ($pkg in ($byPkg.Keys | Sort-Object)) {
            $avg = [math]::Round($byPkg[$pkg].sum / $byPkg[$pkg].n, 1)
            Write-Host ("{0,-30} {1,5}%" -f $pkg, $avg)
          }
          Write-Host "=== End ==="

      # Race detector. The previous comment said "CGO-free packages" but
      # CGO_ENABLED=1 is set on this very step (required by mattn/go-sqlite3).
      # internal/sync (FairQueue, per-file mutex map, gosync.Map) and
      # internal/state (concurrent goroutine writers + cross-process opens)
      # are exactly where races would live, so they must be in this list.
      - name: Race detection
        run: |
          go test -race ./internal/config/ ./internal/filter/ ./internal/lock/ ./internal/logging/ ./internal/metrics/ ./internal/state/ ./internal/sync/ ./internal/watcher/
        env:
          CGO_ENABLED: 1

      - name: Install rclone
        run: |
          choco install rclone -y
          rclone version

      - name: Verify smirror version
        run: |
          go build -o bin\smirror.exe ./cmd/smirror/
          .\bin\smirror.exe version

      - name: Verify smirror test-mirrors
        run: .\bin\smirror.exe test-mirrors
        continue-on-error: true  # may warn if no config or rclone remote
