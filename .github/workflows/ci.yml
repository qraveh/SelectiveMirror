name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Build
        run: go build -v ./cmd/smirror/

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./internal/... ./cmd/...

      - name: Unit tests with coverage
        run: |
          go test -v ./internal/... -coverprofile=coverage.out -covermode=count
          go tool cover -func=coverage.out | findstr "total:"

      - name: Coverage gate (fail if below 35%)
        shell: pwsh
        run: |
          $line = go tool cover -func=coverage.out | Select-String "total:"
          if ($line -match '(\d+\.\d+)%') {
            $pct = [double]$Matches[1]
            Write-Host "Coverage: ${pct}%"
            if ($pct -lt 35.0) {
              Write-Error "Coverage ${pct}% is below 35% threshold"
              exit 1
            }
          } else {
            Write-Error "Could not parse coverage"
            exit 1
          }

      - name: Race detection (CGO-free packages)
        run: |
          go test -race -v ./internal/filter/ ./internal/logging/ ./internal/lock/ ./internal/metrics/ ./internal/watcher/
        env:
          CGO_ENABLED: 1

      - name: Install rclone
        run: |
          choco install rclone -y
          rclone version

      - name: Verify smirror version
        run: |
          go build -o smirror.exe ./cmd/smirror/
          .\smirror.exe version

      - name: Verify smirror test-mirrors
        run: .\smirror.exe test-mirrors
        continue-on-error: true  # may warn if no config or rclone remote
