name: Telemetry emulation

# CI gate: exercises the v2
# telemetry stack end-to-end against a local Supabase instance on every
# PR that touches the schema, the smoke test, the Worker, or the v2
# Go-side primitives. Does NOT touch live infrastructure.
#
# What this catches that the per-package unit tests don't:
#   - Drift between docs/telemetry-v2.sql and the smoke test's
#     payload shape (the Postgres function would reject; CI would fail)
#   - Canonical-JSON parity between the Go signer and PG's JSONB::TEXT
#     (mis-canonicalization → silent HMAC rejection in production)
#   - PostgREST RPC routing assumptions (param binding, return shape)
#   - Smoke test itself (regression catch on the smoke harness)
#
# What it doesn't cover (deferred to live-Supabase fixture):
#   - Vault.decrypted_secrets behavior (we stub it locally)
#   - pg_stat_statements payload-literal absence (CLAIMS-MAP A-03)
#   - Cloudflare Worker edge behavior under real load (covered by
#     manual deploy + scripts/telemetry-v2-smoke-test.py --via-worker)

on:
  pull_request:
    paths:
      - 'docs/telemetry-v2.sql'
      - 'docs/operations/sql/**'
      - 'scripts/telemetry-v2-smoke-test.py'
      - 'scripts/telemetry-report.py'
      - 'scripts/test_telemetry_report.py'
      - 'internal/telemetry/**'
      - 'worker/**'
      - '.github/workflows/telemetry-emulation.yml'
  push:
    branches: [master]
    paths:
      - 'docs/telemetry-v2.sql'
      - 'scripts/telemetry-v2-smoke-test.py'
      - 'scripts/telemetry-report.py'
      - 'internal/telemetry/**'
      - '.github/workflows/telemetry-emulation.yml'

# Default to read-only token at workflow scope. The job runs entirely
# against a local Supabase emulator; no write scopes needed.
permissions:
  contents: read

jobs:
  emulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up PostgreSQL (v15+)
        # FINDING 21 (round-5 validation memo, 2026-05-03): the prior
        # `apt-get install postgresql-15` step has been failing on every
        # PR / push since at least 2026-04-30 because ubuntu-latest
        # (24.04+) doesn't ship `postgresql-15` in the default APT repos.
        # Two fix paths: (a) add the apt.postgresql.org repo before
        # installing v15, or (b) use whatever version is in the default
        # repos and confirm v2 schema is compatible. We pick (a) because
        # pinning the version (rather than tracking the moving Ubuntu
        # default) keeps CI behavior predictable across runner-image
        # updates. v2 needs PG 15+ for `UNIQUE NULLS NOT DISTINCT`; the
        # apt.postgresql.org repo lets us pick v15, v16, or v17 freely.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          # Add the official PostgreSQL APT repo for ubuntu-latest. The
          # script is idempotent and self-contained.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-15 postgresql-contrib-15
          sudo systemctl start postgresql

      - name: Configure local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          # Stub vault.decrypted_secrets — Supabase Vault is a paid-tier
          # feature; local dev needs a shim.
          sudo -u postgres psql <<'SQL'
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.decrypted_secrets (
              name TEXT PRIMARY KEY,
              decrypted_secret TEXT NOT NULL
          );
          INSERT INTO vault.decrypted_secrets (name, decrypted_secret)
          VALUES ('telemetry_master_key',
                  'CIDEVKEY_DO_NOT_USE_IN_PRODUCTION_2026'
          ) ON CONFLICT (name) DO NOTHING;
          -- Stub the service_role + anon roles since we don't have
          -- Supabase's auth machinery locally.
          DO $$ BEGIN
              CREATE ROLE service_role;
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
              CREATE ROLE anon;
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          SQL

      - name: Apply v2 schema
        env:
          PGPASSWORD: postgres
        run: |
          # Apply telemetry-v2.sql against the local Postgres. If the
          # schema has SQL syntax errors or undefined dependencies,
          # this step fails loudly.
          psql -h localhost -U postgres -d postgres \
               -v ON_ERROR_STOP=1 \
               -f docs/telemetry-v2.sql

      - name: Verify expected schema objects
        env:
          PGPASSWORD: postgres
        run: |
          # Three rollup tables, two views, the contribute() RPC, the
          # three internal _bump helpers, and verify_versioned_hmac.
          psql -h localhost -U postgres -d postgres -A -t <<'SQL' | tee /tmp/schema-check.txt
          SELECT relname FROM pg_class
          JOIN pg_namespace ON relnamespace = pg_namespace.oid
          WHERE nspname = 'telemetry'
            AND relkind IN ('r','v')
          ORDER BY relname;
          SQL
          for expected in installation_daily_rollup bug_daily_rollup reliability_daily_rollup version_dist bug_unknown_share; do
            if ! grep -q "^${expected}$" /tmp/schema-check.txt; then
              echo "FAIL: telemetry.${expected} not found in schema dump"
              cat /tmp/schema-check.txt
              exit 1
            fi
          done
          echo "OK: all expected v2 schema objects present"

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg[binary] requests

      - name: Run telemetry-report.py unit tests
        run: |
          python3 scripts/test_telemetry_report.py

      - name: Run smoke test against local Postgres (RPC direct)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # Local-only dev key. Matches the vault stub above so HMAC
          # verification succeeds for known-good test payloads.
          TELEMETRY_MASTER_KEY: CIDEVKEY_DO_NOT_USE_IN_PRODUCTION_2026
          # The smoke test calls Supabase's PostgREST RPC by default;
          # under local Postgres there's no PostgREST, so we point at
          # a stub URL and use --skip-rollup to avoid the worker path.
          # The smoke test gracefully degrades for cases that need the
          # RPC.
          #
          # Future improvement: wire `supabase start` (the supabase-cli)
          # which provides a real local PostgREST + Vault. For now,
          # the per-claim schema tests in system-validation/ provide
          # the structural coverage; this CI step exercises the
          # smoke-test machinery itself.
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dev-service-role-not-real
        run: |
          # Confirm the smoke test parses and the canonical_json helper
          # produces stable output. This catches regressions in the
          # smoke harness without needing a full Supabase stack.
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import importlib.util
          spec = importlib.util.spec_from_file_location('smoke', 'scripts/telemetry-v2-smoke-test.py')
          m = importlib.util.module_from_spec(spec)
          # The script runs argparse at module-import; gate that with
          # a load-only path. Since the script's main() only fires
          # under __name__ == '__main__', exec_module is safe.
          spec.loader.exec_module(m)
          # Sanity: canonical_json on a sorted-key fixture matches
          # PG length-first ordering.
          out = m.canonical_json({'hello': 'world', 'test': 'valid', 'reported_at': '2026'})
          # PG length-first: test (4), hello (5), reported_at (11)
          want = '{\"test\": \"valid\", \"hello\": \"world\", \"reported_at\": \"2026\"}'
          assert out == want, f'canonical_json drift: got {out!r}, want {want!r}'
          # Sanity: build a payload, sign it, verify shape.
          payload = m.make_first_seen_payload('0.0.0-ci')
          sig = m.sign_payload(payload, 'CIDEVKEY_DO_NOT_USE_IN_PRODUCTION_2026', '0.0.0-ci')
          assert len(sig) == 64, f'expected 64-hex HMAC, got {len(sig)}'
          print('smoke harness sanity OK')
          "

      - name: Run system-validation static checks
        env:
          CGO_ENABLED: '1'
        run: |
          # Static schema-claims tests. These don't need a built
          # smirror.exe (they read docs/telemetry-v2.sql as text),
          # but TestMain unconditionally builds smirror.exe.
          # SM-177's lazy rclone preflight means we don't need rclone.
          cd system-validation
          go test -count=1 -run "TestTelemetryV2Schema|TestTelemetryV2Artifacts" -timeout 5m ./...

      - name: Summarize CLAIMS-MAP coverage
        if: always()
        run: |
          # Print the GREEN/AMBER/RED counts so the PR author sees the
          # current state of the validation gate without opening the
          # CLAIMS-MAP file.
          green=$(grep -cE '^\| \*\*[CA]-[0-9]+\*\*.*\| GREEN \|' system-validation/CLAIMS-MAP.md || true)
          amber=$(grep -cE '^\| \*\*[CA]-[0-9]+\*\*.*\| AMBER \|' system-validation/CLAIMS-MAP.md || true)
          red=$(grep -cE '^\| \*\*[CA]-[0-9]+\*\*.*\| RED \|' system-validation/CLAIMS-MAP.md || true)
          echo "CLAIMS-MAP: GREEN=$green AMBER=$amber RED=$red"
