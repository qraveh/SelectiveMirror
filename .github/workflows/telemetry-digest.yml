name: Telemetry weekly digest

# Generates a Markdown telemetry digest every Sunday and opens a PR
# with the new file in docs/telemetry/. The PR is the notification
# mechanism; merge it (or leave it open) at your leisure.
#
# Setup:
#   1. Add repo secret SUPABASE_DATABASE_URL with the Postgres
#      connection string (postgresql://postgres.<ref>:<pwd>@aws-0-eu-west-1.pooler.supabase.com:6543/postgres).
#      Use the service_role-equivalent direct connection, NOT the anon REST API.
#   2. (Optional) Adjust the cron below if you want a different cadence.
#
# Manual trigger: Actions tab -> "Telemetry weekly digest" -> Run workflow.

on:
  schedule:
    # Sunday 03:00 UTC — after pg_cron rollups (02:00, 02:15) finish.
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

# FINDING 22 (round-5 validation memo, 2026-05-03): permissions
# moved from workflow-level to job-level. Workflow-level permissions
# can trip GitHub's validation paths on workflows that lack a `push:`
# trigger (the validator runs against every commit regardless),
# producing 0-second "completed: failure" runs that pollute the
# Actions tab without ever invoking the workflow body. Job-level
# permissions only resolve when the job actually runs (cron or
# workflow_dispatch), so the noise stops.
#
# If the actual cron run still fails because SUPABASE_DATABASE_URL is
# unset, the existing `[ -z "$DATABASE_URL" ]` guard inside the job
# emits a ::warning:: and exits 0 — visible to operators without
# turning the run red.

# Opt into Node.js 24 default for JavaScript actions (silences the
# 2026-06-02 deprecation warning).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Default to read-only at workflow scope. The digest job overrides
# below with the writes it actually needs (commit + PR for the
# weekly digest file).
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg
        run: pip install --quiet psycopg[binary]

      - name: Compute week label
        id: week
        run: |
          # ISO year + week number, e.g. "2026-W17"
          label=$(date -u +%G-W%V)
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "branch=telemetry-digest/$label" >> "$GITHUB_OUTPUT"
          mkdir -p docs/telemetry

      - name: Generate digest
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::SUPABASE_DATABASE_URL secret not set; skipping."
            exit 0
          fi
          out="docs/telemetry/weekly-${{ steps.week.outputs.label }}.md"
          python3 scripts/telemetry-report.py > "$out"
          ls -la "$out"
          head -20 "$out"

      - name: Open PR with the digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip if no file was produced (DATABASE_URL missing case)
          out="docs/telemetry/weekly-${{ steps.week.outputs.label }}.md"
          if [ ! -f "$out" ]; then
            echo "No digest produced; nothing to commit."
            exit 0
          fi

          # If the file is identical to one already on master, don't bother.
          git fetch origin master
          if git diff --quiet origin/master -- "$out" 2>/dev/null; then
            echo "Digest unchanged; no PR needed."
            exit 0
          fi

          branch="${{ steps.week.outputs.branch }}"
          git config user.name  "smirror-telemetry-bot"
          # users.noreply.github.com is the documented bot-author form;
          # anything ending in .local is mDNS scope and gets bounce-
          # checked off real mail. The numeric prefix is the github-
          # actions[bot] account ID, kept stable so commit-author
          # filtering keeps working across repo renames.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$out"
          # Multi-line commit message via printf -F-. The prior literal-
          # string form had continuation lines at column 1, which broke
          # the YAML `run: |` literal block (caused 0-second workflow-parse
          # failures on every push). printf with explicit \n keeps the
          # entire command on one logically indented line.
          printf 'Telemetry digest: %s\n\nThis file was generated by .github/workflows/telemetry-digest.yml on a\nSunday-night cron, using scripts/telemetry-report.py against the live\nSupabase backend. Aggregated counts only — no raw payloads, no install_ids,\nno PII.\n' "${{ steps.week.outputs.label }}" | git commit -F -
          git push --set-upstream origin "$branch" --force-with-lease

          gh pr create \
            --title "Telemetry digest ${{ steps.week.outputs.label }}" \
            --body "Auto-generated weekly telemetry digest. See \`$out\`. Review and merge or close at leisure; the next run will produce a new PR." \
            --base master \
            --head "$branch" \
            --label "telemetry-digest" || \
          gh pr edit "$branch" --title "Telemetry digest ${{ steps.week.outputs.label }}"
